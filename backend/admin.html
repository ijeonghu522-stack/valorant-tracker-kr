<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>관리자 패널 — Valorant Tracker KR</title>
<style>
body { font-family:"Malgun Gothic",sans-serif; background:#10141f; color:#e8ecf4; margin:0; padding:20px; }
h1 { color:#ff4655; } h2 { border-bottom:1px solid #2a3348; padding-bottom:6px; }
.card { background:#1a2030; border-radius:10px; padding:14px; margin:12px 0; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { padding:6px 8px; border-bottom:1px solid #2a3348; text-align:left; }
button { background:#ff4655; color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; margin:2px; }
button.ghost { background:#2a3348; } button.danger { background:#7a1010; }
input { background:#0b0f18; border:1px solid #333; color:#fff; border-radius:4px; padding:6px; }
.badge { border-radius:4px; padding:1px 8px; font-size:12px; }
.pending_payment { background:#5a4300; } .paid { background:#0a5a2a; }
.active { background:#0a5a2a; } .suspended { background:#5a4300; } .revoked { background:#7a1010; }
#gate { max-width:380px; margin:80px auto; text-align:center; }
.hidden { display:none; }
code { background:#0b0f18; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<div id="gate">
  <h1>🔐 관리자 패널</h1>
  <p>ADMIN_TOKEN 입력</p>
  <input id="token" type="password" size="30" />
  <button onclick="login()">입장</button>
</div>
<div id="app" class="hidden">
  <h1>관리자 패널</h1>
  <div class="card">
    <h2>주문 등록 (계좌이체 접수용)</h2>
    입금자명 <input id="c_customer" placeholder="홍길동" />
    금액 <input id="c_amount" value="20000" size="8" />
    메모 <input id="c_memo" placeholder="1개월 Pro" size="20" />
    <button onclick="createOrder()">주문 생성</button>
  </div>
  <div class="card"><h2>주문 목록</h2><table><thead><tr><th>ID</th><th>입금자</th><th>금액</th><th>상태</th><th>키</th><th>액션</th></tr></thead><tbody id="orders"></tbody></table></div>
  <div class="card"><h2>라이선스 (비상 회수/정지)</h2><table><thead><tr><th>키</th><th>고객</th><th>상태</th><th>기기</th><th>만료</th><th>액션</th></tr></thead><tbody id="licenses"></tbody></table></div>
  <div class="card"><h2>감사 로그</h2><table><thead><tr><th>시간</th><th>액션</th><th>상세</th></tr></thead><tbody id="audit"></tbody></table></div>
</div>
<script>
let TOKEN = '';
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', 'x-admin-token': TOKEN }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { alert('토큰 오류'); throw 0; }
  return r.json();
}
async function login() {
  TOKEN = document.getElementById('token').value;
  try { await api('GET', '/api/admin/orders'); document.getElementById('gate').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); refresh(); }
  catch (e) {}
}
async function refresh() {
  const [orders, licenses, audit] = await Promise.all([
    api('GET', '/api/admin/orders'), api('GET', '/api/admin/licenses'), api('GET', '/api/admin/audit')
  ]);
  document.getElementById('orders').innerHTML = orders.map(o => `<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.amount}</td><td><span class="badge ${o.status}">${o.status}</span></td><td>${o.licenseKey ? `<code>${o.licenseKey}</code>` : '-'}</td><td>${o.status === 'pending_payment' ? `<button onclick="markPaid('${o.id}')">입금확인→키발급</button>` : ''}</td></tr>`).join('');
  document.getElementById('licenses').innerHTML = licenses.map(l => `<tr><td><code>${l.key}</code></td><td>${l.customer || ''}</td><td><span class="badge ${l.status}">${l.status}</span></td><td>${(l.devices || []).length}/${l.maxDevices}</td><td>${(l.expiresAt || '').slice(0, 10)}</td><td><button class="ghost" onclick="licAct('${l.key}','suspend')">정지</button><button class="ghost" onclick="licAct('${l.key}','unsuspend')">복구</button><button class="danger" onclick="licAct('${l.key}','revoke')">비상회수</button></td></tr>`).join('');
  document.getElementById('audit').innerHTML = audit.slice(0, 50).map(a => `<tr><td>${a.at}</td><td>${a.action}</td><td>${JSON.stringify(a.detail)}</td></tr>`).join('');
}
async function createOrder() {
  await api('POST', '/api/admin/orders', { customer: document.getElementById('c_customer').value, amount: +document.getElementById('c_amount').value, memo: document.getElementById('c_memo').value });
  refresh();
}
async function markPaid(id) {
  const r = await api('POST', `/api/admin/orders/${id}/paid`);
  alert('발급된 키: ' + r.license.key + '\n이 키를 고객에게 전달하세요.');
  refresh();
}
async function licAct(key, act) {
  if (act === 'revoke' && !confirm('정말 비상 회수(영구)합니까? ' + key)) return;
  await api('POST', `/api/admin/licenses/${key}/${act}`);
  refresh();
}
</script>
</body>
</html>
